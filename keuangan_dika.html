<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEUANGAN DIKA</title>
                          
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        color: #1f2937;
      }

      .container {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
      }

      header {
        background: #4f46e5;
        color: white;
        padding: 20px;
      }

      .header {
        max-width: 1100px;
        margin: auto;
      }

      .card {
        background: white;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      .saldo {
        background: linear-gradient(135deg, #4f46e5, #7c3aed);
        color: white;
        border-radius: 18px;
        padding: 30px;
        margin-bottom: 20px;
      }

      .saldo h1 {
        font-size: 36px;
        margin: 10px 0 25px;
      }

      .ringkasan {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }

      .ringkasan .card {
        margin: 0;
      }

      .masuk {
        color: #16a34a;
      }

      .keluar {
        color: #dc2626;
      }

      .buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      button {
        cursor: pointer;
      }

      .btn {
        border: 0;
        padding: 12px 18px;
        border-radius: 9px;
        font-weight: bold;
      }

      .btn-masuk {
        background: #16a34a;
        color: white;
      }

      .btn-keluar {
        background: #dc2626;
        color: white;
      }

      .btn-blue {
        background: #4f46e5;
        color: white;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;

        margin-top: 6px;
      }

      .form-group {
        margin-bottom: 15px;
      }

      label {
        font-weight: bold;
        font-size: 14px;

      .transaksi {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 5px;
        border-bottom: 1px solid #e5e7eb;
      }

      .transaksi:last-child {
        border-bottom: 0;
      }

      .info {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      .icon {
        width: 42px;
        height: 42px;
        background: #f1f5f9;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .detail small {
        display: block;
        color: #6b7280;
        margin-top: 4px;
      }

      .aksi button {
        border: 0;
        padding: 6px 8px;
        border-radius: 6px;
        margin-left: 4px;
      }

      .edit {
        background: #dbeafe;
      }

      .hapus {
        background: #fee2e2;
      }

      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        align-items: center;
        justify-content: center;
        padding: 15px;
      }

      .modal-box {
        background: white;
        width: 100%;
        max-width: 500px;
        border-radius: 15px;
        padding: 25px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .close {
        background: none;
        border: 0;
        font-size: 25px;
      }

      .modal-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .batal {
        background: #e5e7eb;
      }

      .kosong {
        text-align: center;
        padding: 40px;
        color: #6b7280;
      }

      .progress {
        height: 12px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
        margin: 15px 0;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: #4f46e5;
      }

      @media (max-width: 700px) {
        .ringkasan {
          grid-template-columns: 1fr;
        }

        .buttons {
          flex-direction: column;
        }

        .filter {
          grid-template-columns: 1fr;
        }

        .transaksi {
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header">
        <h2>KEUANGAN DIKA</h2>
        <p>Manajemen Keuangan Pibadi</p>
      </div>
    </header>

    <div class="container">
      <!-- SALDO -->
      <div class="saldo">
        <div>Total Saldo</div>

        <h1 id="saldo">Rp 0</h1>

        <div>
          Pemasukan:
          <strong id="saldoMasuk">Rp 0</strong>
        </div>

        <br />

        <div>
          Pengeluaran:
          <strong id="saldoKeluar">Rp 0</strong>
        </div>
      </div>

      <!-- RINGKASAN -->
      <div class="ringkasan">
        <div class="card">
          <h4>Pemasukan</h4>
          <h2 class="masuk" id="totalMasuk">Rp 0</h2>
        </div>

        <div class="card">
          <h4>Pengeluaran</h4>
          <h2 class="keluar" id="totalKeluar">Rp 0</h2>
        </div>

        <div class="card">
          <h4>Jumlah Transaksi</h4>
          <h2 id="jumlahTransaksi">0</h2>
        </div>
      </div>

      <br />

      <!-- TOMBOL -->
      <div class="buttons">
        <button class="btn btn-masuk" onclick="bukaModal('masuk')">
          + Pemasukan
        </button>

        <button class="btn btn-keluar" onclick="bukaModal('keluar')">
          + Pengeluaran
        </button>

        <button class="btn btn-blue" onclick="downloadCSV()">📊 Export</button>
      </div>

      <!-- DAFTAR -->
      <div class="card">
        <h2>📋 Riwayat Transaksi</h2>

        <div class="filter">
          <input
            id="cari"
            type="text"
            placeholder="Cari transaksi..."
            oninput="tampilkanTransaksi()"
          />

          <select id="filter" onchange="tampilkanTransaksi()">
            <option value="semua">Semua</option>

            <option value="masuk">Pemasukan</option>

            <option value="keluar">Pengeluaran</option>
          </select>
        </div>

        <div id="daftar"></div>
      </div>

      <!-- TARGET -->
      <div class="card">
        <h2>🎯 Target Tabungan</h2>

        <button class="btn btn-blue" onclick="aturTarget()">Atur Target</button>

        <h3 id="namaTarget">Belum ada target</h3>

        <div class="progress">
          <div class="progress-bar" id="progress"></div>
        </div>

        <p id="targetInfo">Rp 0 / Rp 0</p>
      </div>
    </div>

    <!-- MODAL -->
    <div class="modal" id="modal">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="judulModal">Tambah Transaksi</h2>

          <button class="close" onclick="tutupModal()">×</button>
        </div>

        <div class="form-group">
          <label>Jenis Transaksi</label>

          <select id="jenis">
            <option value="masuk">Pemasukan</option>

            <option value="keluar">Pengeluaran</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nominal</label>

          <input
            id="nominal"
            type="number"
            min="1"
            placeholder="Contoh: 50000"
          />
        </div>

        <div class="form-group">
          <label>Kategori</label>

          <select id="kategori">
            <option>Gaji</option>
            <option>Uang Saku</option>
            <option>Bonus</option>
            <option>Makanan</option>
            <option>Transportasi</option>
            <option>Belanja</option>
            <option>Tagihan</option>
            <option>Pendidikan</option>
            <option>Kesehatan</option>
            <option>Hiburan</option>
            <option>Tabungan</option>
            <option>Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label>Metode Pembayaran</label>

          <select id="metode">
            <option>Cash</option>
            <option>Bank</option>
            <option>E-Wallet</option>
            <option>Kartu</option>
          </select>
        </div>

        <div class="form-group">
          <label>Tanggal</label>

          <input id="tanggal" type="date" />
        </div>

        <div class="form-group">
          <label>Keterangan</label>

          <input
            id="keterangan"
            type="text"
            placeholder="Contoh: Makan siang"
          />
        </div>

        <div class="modal-buttons">
          <button class="btn batal" onclick="tutupModal()">Batal</button>

          <button class="btn btn-blue" onclick="simpanTransaksi()">
            Simpan
          </button>
        </div>
      </div>
    </div>

    <script>
      /* =================================
   DATA
================================= */

      var dataKeuangan = [];

      var editIndex = -1;

      var targetNama = "";

      var targetJumlah = 0;

      /* =================================
   FORMAT RUPIAH
================================= */

      function rupiah(angka) {
        return "Rp " + Number(angka).toLocaleString("id-ID");
      }

      /* =================================
   LOAD DATA
================================= */

      function loadData() {
        try {
          var data = localStorage.getItem("keuanganKuData");

          if (data) {
            dataKeuangan = JSON.parse(data);
          }

          var target = localStorage.getItem("keuanganKuTarget");

          if (target) {
            var obj = JSON.parse(target);

            targetNama = obj.nama;

            targetJumlah = Number(obj.jumlah);
          }
        } catch (error) {
          console.log(error);

          dataKeuangan = [];
        }
      }

      /* =================================
   SIMPAN DATA
================================= */

      function simpanData() {
        try {
          localStorage.setItem("keuanganKuData", JSON.stringify(dataKeuangan));
        } catch (error) {
          alert("Data tidak dapat disimpan oleh browser.");
        }
      }

      /* =================================
   BUKA MODAL
================================= */

      function bukaModal(jenis) {
        editIndex = -1;

        document.getElementById("modal").style.display = "flex";

        document.getElementById("judulModal").innerText = "Tambah Transaksi";

        document.getElementById("jenis").value = jenis;

        document.getElementById("nominal").value = "";

        document.getElementById("kategori").value =
          jenis === "masuk" ? "Gaji" : "Makanan";

        document.getElementById("metode").value = "Cash";

        document.getElementById("tanggal").value = new Date()
          .toISOString()
          .substring(0, 10);

        document.getElementById("keterangan").value = "";
      }

      /* =================================
   TUTUP MODAL
================================= */

      function tutupModal() {
        document.getElementById("modal").style.display = "none";
      }

      /* =================================
   SIMPAN TRANSAKSI
================================= */

      function simpanTransaksi() {
        var jenis = document.getElementById("jenis").value;

        var nominal = Number(document.getElementById("nominal").value);

        var kategori = document.getElementById("kategori").value;

        var metode = document.getElementById("metode").value;

        var tanggal = document.getElementById("tanggal").value;

        var keterangan = document.getElementById("keterangan").value.trim();

        /* VALIDASI */

        if (!nominal || nominal <= 0) {
          alert("Nominal harus diisi.");

          return;
        }

        if (!tanggal) {
          alert("Tanggal harus diisi.");

          return;
        }

        /* DATA BARU */

        var transaksi = {
          id: Date.now(),

          jenis: jenis,

          nominal: nominal,

          kategori: kategori,

          metode: metode,

          tanggal: tanggal,

          keterangan: keterangan,
        };

        /* EDIT */

        if (editIndex >= 0) {
          transaksi.id = dataKeuangan[editIndex].id;

          dataKeuangan[editIndex] = transaksi;
        }

        /* TAMBAH */
        else {
          dataKeuangan.push(transaksi);
        }

        /* SIMPAN */

        simpanData();

        /* UPDATE */

        tampilkanTransaksi();

        tutupModal();
      }

      /* =================================
   TAMPILKAN TRANSAKSI
================================= */

      function tampilkanTransaksi() {
        var daftar = document.getElementById("daftar");

        var cari = document.getElementById("cari").value.toLowerCase();

        var filter = document.getElementById("filter").value;

        var hasil = [];

        for (var i = 0; i < dataKeuangan.length; i++) {
          var item = dataKeuangan[i];

          var teks = (
            item.keterangan +
            " " +
            item.kategori +
            " " +
            item.metode
          ).toLowerCase();

          if (cari && teks.indexOf(cari) === -1) {
            continue;
          }

          if (filter !== "semua" && item.jenis !== filter) {
            continue;
          }

          hasil.push({
            data: item,

            index: i,
          });
        }

        /* TERBARU */

        hasil.reverse();

        if (hasil.length === 0) {
          daftar.innerHTML =
            '<div class="kosong">' + "Belum ada transaksi." + "</div>";

          hitung();

          return;
        }

        var html = "";

        for (var j = 0; j < hasil.length; j++) {
          var item = hasil[j].data;

          var index = hasil[j].index;

          var masuk = item.jenis === "masuk";

          html +=
            '<div class="transaksi">' +
            '<div class="info">' +
            '<div class="icon">' +
            (masuk ? "💰" : "💸") +
            "</div>" +
            '<div class="detail">' +
            "<strong>" +
            escapeText(item.keterangan || item.kategori) +
            "</strong>" +
            "<small>" +
            escapeText(item.kategori) +
            " • " +
            escapeText(item.metode) +
            " • " +
            item.tanggal +
            "</small>" +
            "</div>" +
            "</div>" +
            '<div class="aksi">' +
            '<strong class="' +
            (masuk ? "masuk" : "keluar") +
            '">' +
            (masuk ? "+" : "-") +
            rupiah(item.nominal) +
            "</strong>" +
            "<br>" +
            '<button class="edit" ' +
            'onclick="editTransaksi(' +
            index +
            ')">✏️</button>' +
            '<button class="hapus" ' +
            'onclick="hapusTransaksi(' +
            index +
            ')">🗑️</button>' +
            "</div>" +
            "</div>";
        }

        daftar.innerHTML = html;

        hitung();
      }

      /* =================================
   HITUNG SALDO
================================= */

      function hitung() {
        var masuk = 0;

        var keluar = 0;

        for (var i = 0; i < dataKeuangan.length; i++) {
          if (dataKeuangan[i].jenis === "masuk") {
            masuk += Number(dataKeuangan[i].nominal);
          } else {
            keluar += Number(dataKeuangan[i].nominal);
          }
        }

        var saldo = masuk - keluar;

        document.getElementById("saldo").innerText = rupiah(saldo);

        document.getElementById("saldoMasuk").innerText = rupiah(masuk);

        document.getElementById("saldoKeluar").innerText = rupiah(keluar);

        document.getElementById("totalMasuk").innerText = rupiah(masuk);

        document.getElementById("totalKeluar").innerText = rupiah(keluar);

        document.getElementById("jumlahTransaksi").innerText =
          dataKeuangan.length;

        tampilkanTarget(saldo);
      }

      /* =================================
   EDIT TRANSAKSI
================================= */

      function editTransaksi(index) {
        var item = dataKeuangan[index];

        if (!item) {
          return;
        }

        editIndex = index;

        document.getElementById("modal").style.display = "flex";

        document.getElementById("judulModal").innerText = "Edit Transaksi";

        document.getElementById("jenis").value = item.jenis;

        document.getElementById("nominal").value = item.nominal;

        document.getElementById("kategori").value = item.kategori;

        document.getElementById("metode").value = item.metode;

        document.getElementById("tanggal").value = item.tanggal;

        document.getElementById("keterangan").value = item.keterangan;
      }

      /* =================================
   HAPUS
================================= */

      function hapusTransaksi(index) {
        if (!confirm("Hapus transaksi ini?")) {
          return;
        }

        dataKeuangan.splice(index, 1);

        simpanData();

        tampilkanTransaksi();
      }

      /* =================================
   TARGET
================================= */

      function aturTarget() {
        var nama = prompt("Nama target tabungan:", targetNama || "Tabungan");

        if (!nama) {
          return;
        }

        var jumlah = Number(
          prompt("Target tabungan:", targetJumlah || 1000000),
        );

        if (!jumlah || jumlah <= 0) {
          alert("Target tidak valid.");

          return;
        }

        targetNama = nama;

        targetJumlah = jumlah;

        localStorage.setItem(
          "keuanganKuTarget",
          JSON.stringify({
            nama: targetNama,

            jumlah: targetJumlah,
          }),
        );

        hitung();
      }

      /* =================================
   TAMPILKAN TARGET
================================= */

      function tampilkanTarget(saldo) {
        if (!targetJumlah) {
          document.getElementById("namaTarget").innerText = "Belum ada target";

          document.getElementById("targetInfo").innerText = "Rp 0 / Rp 0";

          document.getElementById("progress").style.width = "0%";

          return;
        }

        var persen = (saldo / targetJumlah) * 100;

        if (persen < 0) {
          persen = 0;
        }

        if (persen > 100) {
          persen = 100;
        }

        document.getElementById("namaTarget").innerText = targetNama;

        document.getElementById("targetInfo").innerText =
          rupiah(saldo) + " / " + rupiah(targetJumlah);

        document.getElementById("progress").style.width = persen + "%";
      }

      /* =================================
   EXPORT CSV
================================= */

      function downloadCSV() {
        if (dataKeuangan.length === 0) {
          alert("Belum ada transaksi.");

          return;
        }

        var csv = "Tanggal,Jenis,Kategori,Metode,Nominal,Keterangan\n";

        for (var i = 0; i < dataKeuangan.length; i++) {
          var item = dataKeuangan[i];

          csv +=
            item.tanggal +
            "," +
            item.jenis +
            "," +
            item.kategori +
            "," +
            item.metode +
            "," +
            item.nominal +
            "," +
            '"' +
            (item.keterangan || "").replace(/"/g, '""') +
            '"' +
            "\n";
        }

        var blob = new Blob(["\ufeff" + csv], {
          type: "text/csv",
        });

        var url = URL.createObjectURL(blob);

        var a = document.createElement("a");

        a.href = url;

        a.download = "laporan-keuangan.csv";

        document.body.appendChild(a);

        a.click();

        document.body.removeChild(a);

        URL.revokeObjectURL(url);
      }

      /* =================================
   KEAMANAN TEKS
================================= */

      function escapeText(text) {
        var div = document.createElement("div");

        div.textContent = text || "";

        return div.innerHTML;
      }

      /* =================================
   MULAI PROGRAM
================================= */

      loadData();

      tampilkanTransaksi();
    </script>
  </body>
</html>
